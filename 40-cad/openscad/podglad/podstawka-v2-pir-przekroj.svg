" font-size="15" text-anchor="end" fill="#111" font-family="sans-serif">front 4 mm</text><text x="10.0" y="246" font-size="15" text-anchor="end" fill="#111" font-family="sans-serif">przednia ściana korpusu 2</text><text x="890.0" y="256.0" font-size="15" text-anchor="start" fill="#111" font-family="sans-serif">podkładka M2 4 × 8, wys. 3,5 (było Ø4,5 × 2,5)</text><text x="890.0" y="286.0" font-size="15" text-anchor="start" fill="#111" font-family="sans-serif">płytka PIR 1,5</text><text x="890.0" y="343.0" font-size="15" text-anchor="start" fill="#111" font-family="sans-serif">elementy z tyłu ok. 8</text><text x="890.0" y="372" font-size="15" text-anchor="start" fill="#111" font-family="sans-serif">wkręt M2 × 6 od tyłu: przez płytkę w podkładkę i front</text><text x="450.0" y="90.0" font-size="15" text-anchor="middle" fill="#111" font-family="sans-serif">kopułka wystaje przez otwór Ø24 (ok. 6,5 przed lico)</text><text x="10.0" y="318" font-size="13" text-anchor="end" fill="#111" font-family="sans-serif">kołnierz soczewki 23 × 23 × 3 – 0,5 za frontem</text><text x="10.0" y="342" font-size="13" text-anchor="end" fill="#111" font-family="sans-serif">luty z przodu płytki: 1,5–2,5 luzu</text><line x1="312.0" y1="254.0" x2="14.0" y2="313" stroke="#555" stroke-width="1.2"/><line x1="295.2" y1="260.0" x2="14.0" y2="337" stroke="#555" stroke-width="1.2"/><text x="450.0" y="500.0" font-size="14" text-anchor="middle" fill="#111" font-family="sans-serif">Przekrój poziomy przez osie wkrętów M2 (widok z góry; front i lico na górze, wnętrze szufladki na dole). Skala ok. 12 px = 1 mm.</text><text x="450.0" y="524.0" font-size="14" text-anchor="middle" fill="#111" font-family="sans-serif">Kolejność: PIR kopułką w otwór od tyłu frontu → płytka na podkładki → 2 × M2 × 6 bez siły → front na korpus (PIR wchodzi w okno 38 × 30).</text></g></svg>