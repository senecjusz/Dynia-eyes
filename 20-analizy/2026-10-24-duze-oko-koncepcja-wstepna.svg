<line x1="830.5" y1="294" x2="830.5" y2="264" stroke="#222" stroke-width="3"/>
<line x1="830.5" y1="366" x2="830.5" y2="339" stroke="#222" stroke-width="3"/>
<!-- druty -->
<line x1="712" y1="264" x2="830.5" y2="264" class="wr"/>
<line x1="706" y1="300" x2="830.5" y2="339" class="wrd"/>
<line x1="706" y1="360" x2="830.5" y2="339" class="wrd"/>
<line x1="712" y1="330" x2="830.5" y2="330" class="wrd"/>
<circle cx="712" cy="264" r="3" fill="#c0102a"/>
<line x1="560" y1="330" x2="930" y2="330" class="ax"/>
<!-- opisy -->
<text x="905" y="268" class="s">orczyk S2 → góra–dół</text>
<text x="905" y="345" class="s">orczyk S3: 2 druty</text>
<text x="905" y="358" class="s">→ obie powieki</text>
<text x="560" y="600" class="s">Powieki: otwarte (gruba linia) 50°…125°, zamknięte (przerywana) 0°…75°.</text>
<text x="560" y="615" class="s">Druty powiek (przerywane) na x = −36, poza przekrojem.</text>
<text x="560" y="645" class="s">Dźwignie: górna w górę, dolna w dół; oba druty do tego samego otworu orczyka S3.</text>
<text x="560" y="630" class="s">Kardan 5/5: środek krzyżaka = środek gałki; przód: czop M5 w słupku gałki; tył: czop M5 w słupku L.</text>
<line x1="628" y1="575" x2="898" y2="575" stroke="#333" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="735" y="570" class="t">ok. 90</text>
<line x1="610" y1="470" x2="628" y2="470" stroke="#333"/>
<text x="560" y="490" class="s">gałka +6 przed maskownicą</text>
<line x1="610" y1="420" x2="610" y2="475" stroke="#333" stroke-dasharray="2 2"/>
<line x1="628" y1="455" x2="628" y2="475" stroke="#333" stroke-dasharray="2 2"/>

<g transform="translate(0,90)">
<!-- ============ PRZEKRÓJ A-A ============ -->
<text x="20" y="660" class="h">3. Przekrój A–A (z ≈ −50), widok od przodu</text>
<circle cx="230" cy="820" r="118.5" class="env"/>
<text x="40" y="690" class="s">obrys tuby Ø79 (od środka już nie limit, ale się mieści)</text>
<!-- S3 powieki -->
<rect x="128" y="838" width="36" height="36" class="sv"/>
<rect x="164" y="837.3" width="69" height="37.5" class="sv"/>
<line x1="123.5" y1="856" x2="123.5" y2="829" stroke="#222" stroke-width="3"/>
<text x="175" y="860" class="t">S3 powieki</text>
<!-- S2 góra-dół -->
<rect x="150.5" y="765.3" width="67.5" height="37.5" class="sv"/>
<rect x="218" y="766" width="36" height="36" class="sv"/>
<line x1="257" y1="784" x2="257" y2="754" stroke="#222" stroke-width="3"/>
