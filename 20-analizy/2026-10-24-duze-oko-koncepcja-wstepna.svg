<!-- druty -->
<line x1="712" y1="886" x2="830.5" y2="886" class="wr"/>
<line x1="712" y1="820" x2="830.5" y2="847" class="wr"/>
<line x1="706" y1="712" x2="830.5" y2="712" class="wr"/>
