<text x="560" y="196" class="s">maskownica</text>
<rect x="763" y="211.5" width="45" height="6" class="or" opacity="0.7"/>
<rect x="763" y="442.5" width="45" height="6" class="or" opacity="0.7"/>
<!-- uchwyt serw -->
<rect x="808" y="216" width="90" height="228" class="orl" stroke-dasharray="6 3"/>
<text x="812" y="208" class="s">uchwyt serw</text>
<!-- gałka -->
<path class="ball" d="M724,243.3 A90,90 0 1,0 724,416.7 Z"/>
<rect x="616" y="312" width="46" height="36" fill="#fff" stroke="#888"/>
<rect x="700" y="258" width="24" height="12" fill="#fff" stroke="#888"/>
<!-- kardan -->
<rect x="662" y="313.5" width="38" height="33" class="hw"/>
<rect x="700" y="313.5" width="38" height="33" class="hw"/>
<circle cx="700" cy="330" r="7" fill="#777"/>
