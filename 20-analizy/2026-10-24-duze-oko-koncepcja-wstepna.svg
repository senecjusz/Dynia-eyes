<text x="905" y="890" class="s">S1 → żebro x = 22</text>
<text x="905" y="716" class="s">S3 → dźwignie x = −36</text>
<text x="560" y="1060" class="s">Lewo–prawo: ±35° = ±12,6 mm na żebrze r 22. Góra–dół: ±25° = ±9,3 mm. Druty ok. 40–45 mm, zagięcia Z na obu końcach.</text>
