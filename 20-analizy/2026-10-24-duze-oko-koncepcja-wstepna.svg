<!-- S1 lewo-prawo -->
<rect x="242" y="820" width="36" height="36" class="sv"/>
<rect x="241.3" y="856" width="37.5" height="67.5" class="sv"/>
<line x1="260" y1="817" x2="296" y2="817" stroke="#222" stroke-width="3"/>
<text x="285" y="900" class="t">S1 lewo–prawo</text>
<!-- druty na czoło -->
<circle cx="296" cy="820" r="4" fill="#c0102a"/>
<circle cx="254" cy="754" r="4" fill="#c0102a"/>
<circle cx="122" cy="829" r="4" fill="#c0102a"/>
<line x1="222" y1="820" x2="238" y2="820" stroke="#555"/><line x1="230" y1="812" x2="230" y2="828" stroke="#555"/>
<text x="20" y="965" class="s">Wałki: S1 pionowy (orczyk r 12 w poziomie, y ≈ 0), S2 i S3 poziome (orczyki w pionie).</text>
<text x="20" y="980" class="s">Czerwone kropki = druty widziane z czoła. S1 w narożniku: r 38 – najciaśniejsze miejsce.</text>

<!-- ============ WIDOK Z GÓRY ============ -->
<text x="470" y="598" class="h">4. Przekrój z góry (płaszczyzna pozioma przez oś)</text>
<rect x="634" y="610" width="120" height="91.5" class="pk"/>
<rect x="634" y="938.5" width="120" height="91.5" class="pk"/>
<rect x="628" y="694" width="6" height="7.5" class="or"/>
<rect x="628" y="938.5" width="6" height="7.5" class="or"/>
