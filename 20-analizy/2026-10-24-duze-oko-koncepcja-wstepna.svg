<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1170" width="1120" height="1170" font-family="Arial, sans-serif" font-size="13">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <style>
    .pk{fill:#f3c58a;stroke:#c98a3a;stroke-width:1}
    .or{fill:#f39a3c;stroke:#a85a12;stroke-width:1.5}
    .orl{fill:none;stroke:#a85a12;stroke-width:1.5}
    .ball{fill:#fff;stroke:#444;stroke-width:2}
    .hw{fill:#b9b9b9;stroke:#555;stroke-width:1.2}
    .sv{fill:#c9d6ea;stroke:#2f5590;stroke-width:1.5}
    .svd{fill:none;stroke:#2f5590;stroke-width:1.3;stroke-dasharray:5 3}
    .wr{stroke:#c0102a;stroke-width:2.5;fill:none}
    .wrd{stroke:#c0102a;stroke-width:2;fill:none;stroke-dasharray:6 3}
    .lid{fill:none;stroke:#e06d00;stroke-width:6}
    .lidc{fill:none;stroke:#e06d00;stroke-width:2;stroke-dasharray:4 3}
    .ax{stroke:#777;stroke-width:1;stroke-dasharray:12 3 2 3}
    .env{fill:none;stroke:#e06d00;stroke-width:1.5;stroke-dasharray:8 4}
    .t{fill:#222}
    .h{font-size:16px;font-weight:bold;fill:#222}
    .s{font-size:11px;fill:#444}
  </style>
</defs>
<rect width="1120" height="1170" fill="#fff"/>
<text x="20" y="28" font-size="20" font-weight="bold">Duże oko – wstępna koncepcja (krok 1), 24.10.2026</text>
<text x="20" y="48" class="s">Szkic orientacyjny, skala ok. 1 mm = 3 px. Środek gałki = (0,0,0), z do przodu. Pomarańczowe = druk, białe = gałka, niebieskie = MG90S, czerwone = drut Ø1,0, szare = kupne.</text>

<!-- ============ WIDOK Z PRZODU ============ -->
<text x="20" y="85" class="h">1. Widok z przodu (powieki otwarte)</text>
<path class="pk" fill-rule="evenodd" d="M40,330 a190,190 0 1,0 380,0 a190,190 0 1,0 -380,0 Z M110,330 a120,120 0 1,0 240,0 a120,120 0 1,0 -240,0 Z"/>
<circle cx="230" cy="330" r="126" class="or"/>
<circle cx="230" cy="330" r="114" fill="#4a3526"/>
<circle cx="230" cy="330" r="90" class="ball"/>
<circle cx="230" cy="330" r="36" fill="#7fb58a" stroke="#3d7a4a" stroke-width="1.5"/>
<circle cx="230" cy="330" r="13" fill="#111"/>
<path d="M131,330 A99,99 0 0,1 329,330 A99,75.8 0 0,0 131,330 Z" fill="#d9661a" stroke="#7a3a08" stroke-width="1.5" opacity="0.9"/>
<path d="M131,330 A99,99 0 0,0 329,330 A99,75.8 0 0,1 131,330 Z" fill="#d9661a" stroke="#7a3a08" stroke-width="1.5" opacity="0.9"/>
<line x1="95" y1="330" x2="365" y2="330" class="ax"/>
<circle cx="122" cy="330" r="6" class="hw"/><circle cx="338" cy="330" r="6" class="hw"/>
<text x="250" y="140" class="t">maskownica Ø84 (rant 2 mm)</text>
<line x1="300" y1="146" x2="300" y2="226" stroke="#333" marker-end="url(#ar)"/>
<text x="20" y="560" class="s">Moduł od środka: tuba Ø79 w otworze Ø80, z zewnątrz tylko maskownica Ø84. Gałka Ø60, tęczówka Ø24 (założenie, rysuje syn).</text>
<text x="20" y="575" class="s">Oś powiek = pozioma oś kardana przez środek gałki; osie M3 w uszach pierścienia (x = ±36).</text>
<text x="345" y="322" class="s">oś M3</text>

<!-- ============ PRZEKRÓJ Z BOKU ============ -->
<text x="470" y="85" class="h">2. Przekrój z boku (płaszczyzna pionowa przez oś)</text>
<!-- dynia -->
<rect x="634" y="120" width="120" height="91.5" class="pk"/>
<rect x="634" y="448.5" width="120" height="91.5" class="pk"/>
<text x="640" y="112" class="s">ścianka dyni ~40 (zał.)</text>
<!-- kołnierz + tuba + ramiona -->
<rect x="628" y="204" width="6" height="7.5" class="or"/>
<rect x="628" y="448.5" width="6" height="7.5" class="or"/>
<rect x="628" y="211.5" width="126" height="6" class="or"/>
<rect x="628" y="442.5" width="126" height="6" class="or"/>
<rect x="754" y="156" width="9" height="61.5" class="or"/>
<rect x="754" y="442.5" width="9" height="61.5" class="or"/>
